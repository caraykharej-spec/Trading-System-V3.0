name: Gate Historical Symbol Continuity to HF

on:
  workflow_dispatch:
    inputs:
      base_asset:
        description: "Reviewed Storm base asset with historical ticker continuity"
        required: true
        default: "TON"
        type: string
      end:
        description: "Optional UTC exclusive end; defaults to current UTC day"
        required: false
        default: ""
        type: string
      force:
        description: "Replace existing monthly objects even when SHA-256 matches"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gate-symbol-continuity-to-hf
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AWS_DEFAULT_REGION: ${{ secrets.HF_S3_REGION }}
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: "5"
  HF_S3_MAX_ATTEMPTS: "10"
  HF_S3_RETRY_BASE_SECONDS: "5"
  HF_S3_RETRY_MAX_SECONDS: "300"
  HF_S3_MIN_REQUEST_INTERVAL_SECONDS: "0.25"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
      INPUT_BASE: ${{ inputs.base_asset }}
      INPUT_END: ${{ inputs.end }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research-data dependencies
        run: python -m pip install -e ".[dev,research-data]"
      - name: Run focused continuity and HF tests
        run: >-
          python -m pytest -q
          tests/backtest/test_hf_s3.py
          tests/backtest/test_gate_symbol_continuity_hf_sync.py
      - name: Verify HF storage
        run: python scripts/operations/diagnose_hf_s3_access.py
      - name: Sync reviewed ticker continuity with idempotent whole-route retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(--base-asset "$INPUT_BASE" --output artifacts/route-summary.json)
          if [ -n "${INPUT_END:-}" ]; then args+=(--end "$INPUT_END"); fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then args+=(--force); fi
          delays=(0 15 60 300)
          for attempt in 1 2 3 4; do
            delay="${delays[$((attempt-1))]}"
            if [ "$delay" -gt 0 ]; then
              echo "Retrying continuity route after ${delay}s (attempt ${attempt}/4)"
              sleep "$delay"
            fi
            if python -m scripts.backtest.sync_gate_symbol_continuity_to_hf "${args[@]}"; then
              exit 0
            fi
          done
          echo "Gate historical symbol continuity sync failed after four idempotent attempts." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-symbol-continuity-route-${{ github.run_id }}
          path: artifacts/route-summary.json
          if-no-files-found: ignore
          retention-days: 30

  summarize:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
      SYNC_RESULT: ${{ needs.sync.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate-symbol-continuity-route-${{ github.run_id }}
          path: artifacts/route
      - name: Build and publish continuity run manifest
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.backtest import hf_s3

          summary = json.loads(Path("artifacts/route/route-summary.json").read_text())
          complete = summary.get("status") in {"COMPLETE", "COMPLETE_WITH_RECORDED_GAPS"}
          continuity = summary.get("historical_symbol_continuity") or {}
          failed = (
              os.environ.get("SYNC_RESULT") != "success"
              or not complete
              or len(continuity.get("segments") or []) < 2
          )
          payload = {
              "schema_version": 3,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_sha": os.environ.get("GITHUB_SHA"),
              "status": (
                  "FAIL_INCOMPLETE_GATE_HISTORY_TRANSFER"
                  if failed
                  else "PASS_GATE_SYMBOL_CONTINUITY_TRANSFER"
              ),
              "expected_routes": 1,
              "expected_full_history_routes": 1,
              "expected_blocked_routes": 0,
              "received_route_summaries": 1,
              "completed_routes": 1 if complete else 0,
              "blocked_full_history_routes": 0,
              "no_history_routes": 1 if summary.get("status") == "NO_HISTORY_RETURNED" else 0,
              "error_routes": 1 if summary.get("status") == "ERROR" else 0,
              "missing_route_summaries": 0,
              "route_summaries": [summary],
          }
          Path("artifacts/gate-run-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          hf_s3.aws(
              "s3api", "put-object",
              "--bucket", os.environ["HF_S3_BUCKET"],
              "--key", f"manifests/gate-history/v2/runs/{os.environ['GITHUB_RUN_ID']}.json",
              "--body", "artifacts/gate-run-manifest.json",
              "--content-type", "application/json",
          )
          if failed:
              Path("artifacts/incomplete.flag").write_text("1\n")
          print(json.dumps({
              "status": payload["status"],
              "completed_routes": payload["completed_routes"],
              "source_segments": len(continuity.get("segments") or []),
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-symbol-continuity-run-manifest-${{ github.run_id }}
          path: artifacts/gate-run-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce complete continuity transfer
        run: |
          if [ -f artifacts/incomplete.flag ]; then exit 1; fi
