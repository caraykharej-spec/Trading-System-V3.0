name: Yahoo Fallback Full History to HF

on:
  workflow_dispatch:
    inputs:
      end:
        description: "UTC exclusive upper bound; leave empty for current UTC"
        required: false
        default: ""
        type: string
      force:
        description: "Replace yearly objects even when SHA-256 matches"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: yahoo-full-history-to-hf
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AWS_DEFAULT_REGION: ${{ secrets.HF_S3_REGION }}
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      route_count: ${{ steps.matrix.outputs.route_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research-data dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run focused unit tests
        run: >-
          python -m pytest -q
          tests/backtest/test_yahoo_history_hf_sync.py
          tests/backtest/test_yahoo_fallback_route_filter.py
      - name: Verify HF storage before discovery
        run: python scripts/operations/diagnose_hf_s3_access.py
      - name: Discover explicit Yahoo routes
        run: >-
          python -m scripts.backtest.sync_yahoo_history_to_hf
          --discover-only --output artifacts/yahoo-discovery.json
      - name: Filter to required Yahoo fallbacks
        run: >-
          python -m scripts.backtest.filter_yahoo_fallback_routes
          --input artifacts/yahoo-discovery.json
          --output artifacts/yahoo-fallback-discovery.json
      - name: Build fallback route matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/yahoo-fallback-discovery.json").read_text())
          routes = payload["routes"]
          if not routes:
              raise SystemExit("No required Yahoo fallback routes found")
          if len(routes) > 256:
              raise SystemExit(f"GitHub matrix limit exceeded: {len(routes)} > 256")
          print("matrix=" + json.dumps({"route": routes}, separators=(",", ":")))
          print(f"route_count={len(routes)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-discovery-${{ github.run_id }}
          path: |
            artifacts/yahoo-discovery.json
            artifacts/yahoo-fallback-discovery.json
          retention-days: 30

  sync:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
      INPUT_END: ${{ inputs.end }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[research-data]"
      - name: Sync Yahoo fallback route to private HF storage
        run: |
          mkdir -p artifacts
          args=(--canonical '${{ matrix.route.canonical_symbol }}' --base-asset '${{ matrix.route.base_asset }}' --asset-class '${{ matrix.route.asset_class }}' --provider-symbol '${{ matrix.route.provider_symbol }}' --price-multiplier '${{ matrix.route.price_multiplier }}' --output artifacts/route-summary.json)
          if [ '${{ matrix.route.requires_volume }}' = 'false' ]; then args+=(--no-requires-volume); fi
          if [ -n "${INPUT_END:-}" ]; then args+=(--end "$INPUT_END"); fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then args+=(--force); fi
          python -m scripts.backtest.sync_yahoo_history_to_hf "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-route-${{ strategy.job-index }}
          path: artifacts/route-summary.json
          if-no-files-found: ignore
          retention-days: 30

  summarize:
    needs: [discover, sync]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yahoo-route-*
          path: artifacts/routes
      - name: Validate complete fallback transfer
        env:
          EXPECTED_ROUTES: ${{ needs.discover.outputs.route_count }}
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          summaries = [json.loads(p.read_text()) for p in Path("artifacts/routes").rglob("route-summary.json")]
          expected = int(os.environ["EXPECTED_ROUTES"])
          complete = sum(item.get("status") == "COMPLETE" for item in summaries)
          errors = sum(item.get("status") == "ERROR" for item in summaries)
          missing = max(0, expected - len(summaries))
          failed = (
              os.environ.get("SYNC_RESULT") != "success"
              or complete != expected
              or errors != 0
              or missing != 0
          )
          payload = {
              "schema_version": 2,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "selection_policy": "required_yahoo_fallbacks_only",
              "status": "FAIL_INCOMPLETE_YAHOO_TRANSFER" if failed else "PASS_COMPLETE_YAHOO_TRANSFER",
              "expected_routes": expected,
              "received_route_summaries": len(summaries),
              "completed_routes": complete,
              "error_routes": errors,
              "missing_route_summaries": missing,
              "total_rows": sum(int(item.get("total_rows", 0)) for item in summaries),
              "partition_objects_recorded": sum(int(item.get("partition_objects_recorded", 0)) for item in summaries),
              "route_summaries": summaries,
          }
          Path("artifacts/yahoo-run-manifest.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps({k: payload[k] for k in ("status", "expected_routes", "completed_routes", "error_routes", "missing_route_summaries", "total_rows", "partition_objects_recorded")}))
          if failed:
              Path("artifacts/incomplete.flag").write_text("1\n")
          PY
      - name: Normalize HF endpoint
        id: endpoint
        shell: bash
        run: |
          endpoint="$HF_S3_ENDPOINT"
          case "$endpoint" in
            http://*|https://*) ;;
            *) endpoint="https://$endpoint" ;;
          esac
          echo "url=$endpoint" >> "$GITHUB_OUTPUT"
      - name: Publish Yahoo run manifest to HF
        run: |
          aws s3api put-object \
            --bucket "$HF_S3_BUCKET" \
            --key "manifests/yahoo-history/v1/runs/${GITHUB_RUN_ID}.json" \
            --body artifacts/yahoo-run-manifest.json \
            --content-type application/json \
            --endpoint-url "${{ steps.endpoint.outputs.url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-run-manifest-${{ github.run_id }}
          path: artifacts/yahoo-run-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce complete fallback transfer
        run: |
          if [ -f artifacts/incomplete.flag ]; then
            echo "Yahoo fallback transfer is incomplete." >&2
            exit 1
          fi
