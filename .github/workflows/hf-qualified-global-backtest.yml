name: HF Qualified Global Backtest

on:
  push:
    branches: ["backtest-global-81-*"]
    paths:
      - ".github/workflows/hf-qualified-global-backtest.yml"
      - "scripts/backtest/run_hf_qualified_asset_backtest.py"
      - "scripts/backtest/aggregate_hf_global_backtest.py"
      - "tests/backtest/test_hf_qualified_asset_backtest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-qualified-global-backtest-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AWS_DEFAULT_REGION: ${{ secrets.HF_S3_REGION }}
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: "5"
  HF_S3_MAX_ATTEMPTS: "10"
  HF_S3_RETRY_BASE_SECONDS: "5"
  HF_S3_RETRY_MAX_SECONDS: "300"
  HF_S3_MIN_REQUEST_INTERVAL_SECONDS: "0.25"
  QUALIFICATION_KEY: manifests/global-history/v1/latest.json

jobs:
  qualify-input:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,research-data]"
      - name: Validate runner contracts
        run: python -m pytest -q tests/backtest/test_hf_qualified_asset_backtest.py
      - name: Verify HF storage
        run: python scripts/operations/diagnose_hf_s3_access.py
      - name: Lock qualified 81-asset matrix
        id: contract
        run: |
          mkdir -p artifacts
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from scripts.backtest import hf_s3

          target = Path("artifacts/global-history-qualification.json")
          hf_s3.aws(
              "s3api", "get-object",
              "--bucket", os.environ["HF_S3_BUCKET"],
              "--key", os.environ["QUALIFICATION_KEY"],
              str(target),
          )
          payload = json.loads(target.read_text())
          if payload.get("status") != "PASS_GLOBAL_HISTORY_QUALIFICATION":
              raise SystemExit("Latest global history qualification is not PASS")
          if payload.get("storm_asset_count") != 81 or payload.get("qualified_asset_count") != 81:
              raise SystemExit("Latest qualification is not the required 81/81 contract")
          if payload.get("missing_asset_count") != 0 or payload.get("insufficient_history_asset_count") != 0:
              raise SystemExit("Latest qualification contains missing or insufficient assets")
          assets = sorted(str(item["base_asset"]).upper() for item in payload["assets"])
          excluded = {"BTCDEGEN", "ETHDEGEN", "SOLDEGEN", "XMR"}
          if len(assets) != 81 or len(set(assets)) != 81 or excluded.intersection(assets):
              raise SystemExit("Qualified asset membership violates project scope")
          matrix = {"asset": [{"base_asset": base, "slug": base.lower()} for base in assets]}
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-qualified-global-backtest-contract-${{ github.sha }}
          path: artifacts/global-history-qualification.json
          if-no-files-found: error
          retention-days: 90

  backtest:
    needs: qualify-input
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.qualify-input.outputs.matrix) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[research-data]"
      - name: Run ${{ matrix.asset.base_asset }} qualified backtest
        run: >-
          python -m scripts.backtest.run_hf_qualified_asset_backtest
          --base-asset "${{ matrix.asset.base_asset }}"
          --qualification-key "$QUALIFICATION_KEY"
          --git-revision "$GITHUB_SHA"
          --output "artifacts/backtest/${{ matrix.asset.slug }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-qualified-backtest-${{ matrix.asset.slug }}-${{ github.sha }}
          path: artifacts/backtest/${{ matrix.asset.slug }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: backtest
    if: always() && needs.backtest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[research-data]"
      - uses: actions/download-artifact@v4
        with:
          pattern: hf-qualified-backtest-*-${{ github.sha }}
          path: artifacts/asset-results
      - name: Build complete 81-asset report
        run: >-
          python -m scripts.backtest.aggregate_hf_global_backtest
          --input-root artifacts/asset-results
          --output artifacts/backtest/global-81-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: hf-qualified-global-backtest-summary-${{ github.sha }}
          path: artifacts/backtest/global-81-summary.json
          if-no-files-found: error
          retention-days: 90
