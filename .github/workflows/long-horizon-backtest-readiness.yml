name: Long Horizon Backtest Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "app/backtest/engine.py"
      - "app/backtest/incremental_snapshots.py"
      - "app/backtest/locked_dataset.py"
      - "scripts/backtest/benchmark_incremental_snapshots.py"
      - "tests/backtest/test_incremental_snapshots.py"
      - "tests/backtest/test_locked_dataset_entrypoint.py"
      - ".github/workflows/long-horizon-backtest-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Incremental equivalence and locked-dataset tests
        run: |
          python -m pytest -q \
            tests/backtest/test_incremental_snapshots.py \
            tests/backtest/test_locked_dataset_entrypoint.py
      - name: Reference versus incremental benchmark
        run: |
          python scripts/backtest/benchmark_incremental_snapshots.py \
            --bars 400 \
            --output artifacts/backtest/long-horizon-readiness.json
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: long-horizon-readiness-${{ github.sha }}
          path: artifacts/backtest/long-horizon-readiness.json
          if-no-files-found: error
          retention-days: 30
