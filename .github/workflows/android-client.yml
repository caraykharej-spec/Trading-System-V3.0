name: Android Client

on:
  push:
    branches: [main, "phase-42*"]
    paths:
      - "clients/android/**"
      - ".github/workflows/android-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/android/**"
      - ".github/workflows/android-client.yml"

jobs:
  build:
    name: Android / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit test and assemble debug APK
        run: gradle -p clients/android testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: trading-system-android-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
