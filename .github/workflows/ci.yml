name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: CI / quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile all Python modules
        run: python -m compileall -q app interfaces scripts main.py
      - name: Ruff lint and import-order gate
        run: python -m ruff check app interfaces scripts tests main.py
      - name: Strict static typing gate
        run: python -m mypy app interfaces main.py
      - name: Unit and integration tests with coverage
        run: python -m pytest -q --cov=app --cov=interfaces --cov-report=term-missing
