name: Hugging Face Storage Diagnostics

on:
  push:
    branches: [hf-storage-diagnostics]
    paths:
      - scripts/operations/diagnose_hf_s3_access.py
      - .github/workflows/hf-storage-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-storage-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_ENDPOINT: ${{ secrets.HF_S3_ENDPOINT }}
      HF_S3_BUCKET: ${{ secrets.HF_S3_BUCKET }}
      AWS_DEFAULT_REGION: ${{ secrets.HF_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify private bucket read/write integrity
        run: python scripts/operations/diagnose_hf_s3_access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-s3-access-diagnostics-${{ github.run_id }}
          path: artifacts/hf-s3-access-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
