name: Gate TradFi Full History to B2

on:
  push:
    branches: ["gate-tradfi-b2-full-history"]
    paths:
      - ".github/workflows/gate-tradfi-full-history-to-b2.yml"
      - "scripts/backtest/sync_gate_tradfi_history_to_b2.py"
      - "scripts/backtest/sync_gate_universe_history_to_b2.py"
      - "config/universe.json"
      - "config/market_data/source_registry.json"
      - "app/universe/gateio_discovery.py"
      - "app/universe/storm_discovery.py"
      - "app/data/source_registry.py"
      - "tests/backtest/test_gate_tradfi_history_b2_sync.py"
  workflow_dispatch:
    inputs:
      end:
        description: "UTC exclusive upper bound (ISO-8601); leave empty to use current UTC time"
        required: false
        default: ""
        type: string
      force:
        description: "Replace monthly objects even when SHA verification matches"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gate-tradfi-full-history-to-b2
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  AWS_DEFAULT_REGION: eu-central-003
  AWS_EC2_METADATA_DISABLED: "true"
  GATE_TRADFI_REQUEST_DELAY: "1.0"

jobs:
  discover:
    name: Discover Gate TradFi project routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      route_count: ${{ steps.matrix.outputs.route_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install pytest
          python -m pip install -e ".[research-data]"
      - name: Run focused unit tests
        run: python -m pytest -q tests/backtest/test_gate_tradfi_history_b2_sync.py
      - name: Verify B2 write/read/delete integrity before matrix
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_S3_ENDPOINT B2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then echo "Missing required secret-backed environment variable: $name" >&2; exit 1; fi
          done
          endpoint="$B2_S3_ENDPOINT"
          case "$endpoint" in http://*|https://*) ;; *) endpoint="https://$endpoint" ;; esac
          mkdir -p artifacts/b2-preflight
          key="_connectivity/gate-tradfi/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'run=%s\nattempt=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > artifacts/b2-preflight/source.txt
          expected="$(sha256sum artifacts/b2-preflight/source.txt | awk '{print $1}')"
          aws s3api put-object --bucket "$B2_BUCKET_NAME" --key "$key" --body artifacts/b2-preflight/source.txt --metadata "sha256=$expected" --endpoint-url "$endpoint" >/dev/null
          if ! aws s3 cp "s3://$B2_BUCKET_NAME/$key" artifacts/b2-preflight/readback.txt --endpoint-url "$endpoint"; then
            echo "B2 preflight read-back failed for key=$key endpoint=$endpoint" >&2
            exit 1
          fi
          actual="$(sha256sum artifacts/b2-preflight/readback.txt | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then echo "B2 preflight SHA-256 mismatch: $actual != $expected" >&2; exit 1; fi
          aws s3api delete-object --bucket "$B2_BUCKET_NAME" --key "$key" --endpoint-url "$endpoint" >/dev/null
          echo "B2 preflight PASS sha256=$actual"
      - name: Discover Gate TradFi routes
        run: >-
          python -m scripts.backtest.sync_gate_tradfi_history_to_b2
          --discover-only
          --output artifacts/gate-tradfi-discovery.json
      - name: Build bounded matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/gate-tradfi-discovery.json").read_text(encoding="utf-8"))
          routes = payload["routes"]
          if not routes: raise SystemExit("Gate TradFi discovery returned no routes")
          if len(routes) > 256: raise SystemExit(f"GitHub matrix limit exceeded: {len(routes)} > 256")
          print("matrix=" + json.dumps({"route": routes}, separators=(",", ":")))
          print(f"route_count={len(routes)}")
          PY
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-tradfi-discovery-${{ github.run_id }}
          path: artifacts/gate-tradfi-discovery.json
          if-no-files-found: error
          retention-days: 30

  sync:
    name: Sync Gate TradFi ${{ matrix.route.provider_symbol }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      ROUTE_CANONICAL: ${{ matrix.route.canonical_symbol }}
      ROUTE_BASE: ${{ matrix.route.base_asset }}
      ROUTE_ASSET_CLASS: ${{ matrix.route.asset_class }}
      ROUTE_PROVIDER_SYMBOL: ${{ matrix.route.provider_symbol }}
      ROUTE_PRICE_MULTIPLIER: ${{ matrix.route.price_multiplier }}
      ROUTE_ORIGIN: ${{ matrix.route.route_origin }}
      INPUT_END: ${{ inputs.end }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research-data dependencies
        run: python -m pip install -e ".[research-data]"
      - name: Validate B2 secret-backed environment
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_S3_ENDPOINT B2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then echo "Missing required secret-backed environment variable: $name" >&2; exit 1; fi
          done
          aws --version
      - name: Sync complete Gate TradFi history for route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(--canonical "$ROUTE_CANONICAL" --base-asset "$ROUTE_BASE" --asset-class "$ROUTE_ASSET_CLASS" --provider-symbol "$ROUTE_PROVIDER_SYMBOL" --price-multiplier "$ROUTE_PRICE_MULTIPLIER" --route-origin "$ROUTE_ORIGIN" --output artifacts/route-summary.json)
          if [ -n "${INPUT_END:-}" ]; then args+=(--end "$INPUT_END"); fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then args+=(--force); fi
          python - "${args[@]}" <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          from scripts.backtest import sync_gate_tradfi_history_to_b2 as module

          # Gate TradFi native 4h/1d bars are session anchored; preserve provider timestamps.
          module._SECONDS["4h"] = 3600
          module._SECONDS["1d"] = 3600

          # Verify the exact object bytes through the S3 high-level copy command. This avoids
          # relying on custom HEAD metadata and avoids get-object positional-argument ambiguity.
          def content_sha256(key: str):
              with tempfile.TemporaryDirectory(prefix="b2-verify-") as temp_dir:
                  target = Path(temp_dir) / "object.bin"
                  result = module._aws("s3", "cp", f"s3://{module._bucket()}/{key}", str(target), check=False, quiet=False)
                  if result.returncode != 0:
                      detail = (result.stderr or result.stdout or "unknown aws-cli error").strip()
                      raise RuntimeError(f"B2 read-back failed for {key}: rc={result.returncode}; {detail}")
                  if not target.exists():
                      raise RuntimeError(f"B2 read-back reported success but produced no file for {key}")
                  return module._sha256(target)

          module._head_sha256 = content_sha256
          sys.argv = ["sync_gate_tradfi_history_to_b2.py", *sys.argv[1:]]
          raise SystemExit(module.main())
          PY
      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-tradfi-route-${{ matrix.route.base_asset }}-${{ matrix.route.provider_symbol }}
          path: artifacts/route-summary.json
          if-no-files-found: ignore
          retention-days: 30

  summarize:
    name: Consolidate Gate TradFi transfer evidence
    needs: [discover, sync]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      EXPECTED_ROUTES: ${{ needs.discover.outputs.route_count }}
      SYNC_RESULT: ${{ needs.sync.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research-data dependencies
        run: python -m pip install -e ".[research-data]"
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-tradfi-route-*
          path: artifacts/routes
          merge-multiple: false
      - name: Build and validate run manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          summaries = [json.loads(p.read_text(encoding="utf-8")) for p in sorted(Path("artifacts/routes").rglob("route-summary.json"))]
          expected = int(os.environ["EXPECTED_ROUTES"])
          sync_result = os.environ.get("SYNC_RESULT")
          complete = sum(item.get("status") == "COMPLETE" for item in summaries)
          errors = sum(item.get("status") == "ERROR" for item in summaries)
          unexpected = sum(item.get("status") not in {"COMPLETE", "ERROR"} for item in summaries)
          missing = max(0, expected - len(summaries))
          failed = bool(sync_result != "success" or complete != expected or errors or unexpected or missing)
          payload = {"schema_version":3,"generated_at":datetime.now(timezone.utc).isoformat(),"github_run_id":os.environ.get("GITHUB_RUN_ID"),"github_sha":os.environ.get("GITHUB_SHA"),"status":"FAIL_INCOMPLETE_GATE_TRADFI_TRANSFER" if failed else "PASS_COMPLETE_GATE_TRADFI_TRANSFER","sync_job_result":sync_result,"expected_routes":expected,"received_route_summaries":len(summaries),"completed_routes":complete,"error_routes":errors,"unexpected_status_routes":unexpected,"missing_route_summaries":missing,"total_rows":sum(int(item.get("total_rows",0)) for item in summaries),"partition_objects_recorded":sum(int(item.get("partition_objects_recorded",0)) for item in summaries),"reused_verified_partition_objects":sum(int(item.get("reused_verified_partition_objects",0)) for item in summaries),"uploaded_or_replaced_partition_objects":sum(int(item.get("uploaded_or_replaced_partition_objects",0)) for item in summaries),"route_summaries":summaries}
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/gate-tradfi-run-manifest.json").write_text(json.dumps(payload,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:payload[k] for k in ("status","expected_routes","received_route_summaries","completed_routes","error_routes","missing_route_summaries","total_rows","partition_objects_recorded")},sort_keys=True))
          if failed: raise SystemExit("Gate TradFi transfer is incomplete")
          PY
      - name: Publish consolidated run manifest to B2
        if: success()
        run: >-
          python -m scripts.backtest.sync_gate_tradfi_history_to_b2
          --publish-manifest artifacts/gate-tradfi-run-manifest.json
          --run-id "$GITHUB_RUN_ID"
          --output artifacts/published-run-manifest.json
      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-tradfi-run-manifest-${{ github.run_id }}
          path: |
            artifacts/gate-tradfi-run-manifest.json
            artifacts/published-run-manifest.json
          if-no-files-found: ignore
          retention-days: 90
