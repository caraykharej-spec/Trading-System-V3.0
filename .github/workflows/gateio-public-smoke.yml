name: Gate.io Public Market Data Smoke

on:
  workflow_dispatch:
  push:
    branches: ["phase-37-1-gateio-live-smoke"]

permissions:
  contents: read

jobs:
  smoke:
    name: gateio-public-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Connect to Gate.io public Spot WebSocket
        run: python scripts/market_data/gateio_public_smoke.py
