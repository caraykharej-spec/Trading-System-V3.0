name: Phase 48 Statistical Qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-48-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-48:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Dataset and statistical gates
        run: |
          python -m pytest -q \
            tests/data_platform/test_phase_48_versioned_dataset.py \
            tests/backtest/test_phase_48_qualification_batch.py
