name: One-Year Locked Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "app/backtest/**"
      - "app/data/**"
      - "app/market/**"
      - "app/risk/**"
      - "app/strategy/**"
      - "app/storm_costs/**"
      - "scripts/backtest/**"
      - "tests/backtest/**"
      - "tests/data_platform/**"
      - ".github/workflows/one-year-locked-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-year-locked-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Warm-up, archive reconstruction, locked assembly and baseline tests
        run: |
          python -m pytest -q \
            tests/backtest/test_incremental_snapshots.py \
            tests/data_platform/test_gateio_deals_archive.py \
            tests/data_platform/test_locked_dataset_merge.py \
            tests/backtest/test_locked_historical_baseline.py

  archive-availability:
    needs: unit-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Require every warm-up and evaluation archive before heavy downloads
        run: |
          python scripts/backtest/check_gate_deals_archive_availability.py \
            --symbol BTC/USDT \
            --month 202502 \
            --month 202503 \
            --month 202504 \
            --month 202505 \
            --month 202506 \
            --month 202507 \
            --month 202508 \
            --month 202509 \
            --month 202510 \
            --month 202511 \
            --month 202512 \
            --month 202601 \
            --month 202602 \
            --month 202603 \
            --month 202604 \
            --month 202605 \
            --month 202606

  archive-shard:
    needs: archive-availability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: archive-202502
            month: "202502"
            start: 2025-02-25T00:00:00Z
            end: 2025-03-01T00:00:00Z
          - shard: archive-202503
            month: "202503"
            start: 2025-03-01T00:00:00Z
            end: 2025-04-01T00:00:00Z
          - shard: archive-202504
            month: "202504"
            start: 2025-04-01T00:00:00Z
            end: 2025-05-01T00:00:00Z
          - shard: archive-202505
            month: "202505"
            start: 2025-05-01T00:00:00Z
            end: 2025-06-01T00:00:00Z
          - shard: archive-202506
            month: "202506"
            start: 2025-06-01T00:00:00Z
            end: 2025-07-01T00:00:00Z
          - shard: archive-202507
            month: "202507"
            start: 2025-07-01T00:00:00Z
            end: 2025-08-01T00:00:00Z
          - shard: archive-202508
            month: "202508"
            start: 2025-08-01T00:00:00Z
            end: 2025-09-01T00:00:00Z
          - shard: archive-202509
            month: "202509"
            start: 2025-09-01T00:00:00Z
            end: 2025-10-01T00:00:00Z
          - shard: archive-202510
            month: "202510"
            start: 2025-10-01T00:00:00Z
            end: 2025-11-01T00:00:00Z
          - shard: archive-202511
            month: "202511"
            start: 2025-11-01T00:00:00Z
            end: 2025-12-01T00:00:00Z
          - shard: archive-202512
            month: "202512"
            start: 2025-12-01T00:00:00Z
            end: 2026-01-01T00:00:00Z
          - shard: archive-202601
            month: "202601"
            start: 2026-01-01T00:00:00Z
            end: 2026-02-01T00:00:00Z
          - shard: archive-202602
            month: "202602"
            start: 2026-02-01T00:00:00Z
            end: 2026-03-01T00:00:00Z
          - shard: archive-202603
            month: "202603"
            start: 2026-03-01T00:00:00Z
            end: 2026-04-01T00:00:00Z
          - shard: archive-202604
            month: "202604"
            start: 2026-04-01T00:00:00Z
            end: 2026-05-01T00:00:00Z
          - shard: archive-202605
            month: "202605"
            start: 2026-05-01T00:00:00Z
            end: 2026-06-01T00:00:00Z
          - shard: archive-202606
            month: "202606"
            start: 2026-06-01T00:00:00Z
            end: 2026-06-13T00:00:00Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Reconstruct and seal ${{ matrix.shard }} from official Gate deals
        run: |
          python scripts/backtest/backfill_gate_deals_archive.py \
            --symbol BTC/USDT \
            --archive-month "${{ matrix.month }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --dataset-version 1.0.0 \
            --max-retries 3 \
            --retry-backoff-seconds 2 \
            --timeout-seconds 180 \
            --git-revision "$GITHUB_SHA" \
            --output-dir "artifacts/backfill/${{ matrix.shard }}"
      - name: Upload verified archive shard
        uses: actions/upload-artifact@v4
        with:
          name: btc-usdt-warmup-plus-1y-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/backfill/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  recent-rest-shard:
    needs: unit-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Backfill and seal recent Gate REST shard
        run: |
          python scripts/backtest/backfill_historical_dataset.py \
            --symbol BTC/USDT \
            --start 2026-06-13T00:00:00Z \
            --end 2026-09-13T00:00:00Z \
            --dataset-version 1.0.0 \
            --chunk-points 900 \
            --max-retries 4 \
            --retry-backoff-seconds 2 \
            --git-revision "$GITHUB_SHA" \
            --output-dir artifacts/backfill/rest-20260613-20260913
      - name: Upload verified REST shard
        uses: actions/upload-artifact@v4
        with:
          name: btc-usdt-warmup-plus-1y-rest-20260613-20260913-${{ github.sha }}
          path: artifacts/backfill/rest-20260613-20260913
          if-no-files-found: error
          retention-days: 30

  assemble-research-lock:
    needs: [archive-shard, recent-rest-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download all verified shards
        uses: actions/download-artifact@v4
        with:
          pattern: btc-usdt-warmup-plus-1y-*-${{ github.sha }}
          path: artifacts/shards
          merge-multiple: false
      - name: Assemble and re-verify warm-up plus one-year research lock
        shell: bash
        run: |
          set -euo pipefail
          shard_args=()
          for shard_dir in artifacts/shards/btc-usdt-warmup-plus-1y-*-${GITHUB_SHA}; do
            shard_args+=(--shard-dir "$shard_dir")
          done
          if [ "${#shard_args[@]}" -ne 36 ]; then
            echo "Expected eighteen shard directories; got ${#shard_args[@]} CLI elements" >&2
            exit 1
          fi
          python scripts/backtest/merge_locked_dataset_shards.py \
            "${shard_args[@]}" \
            --dataset-version 1.0.0 \
            --git-revision "$GITHUB_SHA" \
            --output-dir artifacts/research-lock
      - name: Upload verified research lock
        uses: actions/upload-artifact@v4
        with:
          name: btc-usdt-warmup-plus-1y-locked-${{ github.sha }}
          path: artifacts/research-lock
          if-no-files-found: error
          retention-days: 30

  controlled-baseline:
    needs: assemble-research-lock
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download verified research lock
        uses: actions/download-artifact@v4
        with:
          name: btc-usdt-warmup-plus-1y-locked-${{ github.sha }}
          path: artifacts/research-lock
      - name: Run controlled one-year evaluation with bounded retries
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if python scripts/backtest/run_locked_historical_baseline.py \
              --dataset-dir artifacts/research-lock \
              --evaluation-start 2025-09-13T00:00:00Z \
              --git-revision "$GITHUB_SHA" \
              --output artifacts/baseline/btc-usdt-1y-evaluation-baseline.json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-usdt-1y-evaluation-baseline-${{ github.sha }}
          path: artifacts/baseline/btc-usdt-1y-evaluation-baseline.json
          if-no-files-found: error
          retention-days: 30
