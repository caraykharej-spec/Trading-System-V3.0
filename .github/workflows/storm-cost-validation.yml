name: Storm Cost Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-47*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-47:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/storm_costs tests/unit/test_backtest_costs.py
