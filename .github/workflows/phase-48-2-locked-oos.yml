name: Phase 48.2 Locked OOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-48-2-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/backtest/test_phase_48_2_locked_oos.py
