name: Phase 47.3 Incremental Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-47-3*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incremental-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/data_platform/test_phase_47_3_incremental_cache.py tests/unit/test_budgeted_market_scan.py
