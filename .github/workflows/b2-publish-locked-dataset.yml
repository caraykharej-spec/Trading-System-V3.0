name: B2 Publish Locked Dataset

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID containing the verified locked dataset artifact"
        required: true
        type: string
      source_artifact_name:
        description: "Exact locked dataset artifact name"
        required: true
        type: string
      source_revision:
        description: "Source dataset Git revision recorded in the B2 research fingerprint"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/b2-publish-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: b2-gold-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: eu-central-003
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate trusted publication source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          INPUT_SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              run_id = os.environ.get("INPUT_RUN_ID", "")
              artifact_name = os.environ.get("INPUT_ARTIFACT_NAME", "")
              source_revision = os.environ.get("INPUT_SOURCE_REVISION", "")
          else:
              request = json.loads(Path(".github/b2-publish-request.json").read_text(encoding="utf-8"))
              run_id = str(request.get("source_run_id", ""))
              artifact_name = str(request.get("source_artifact_name", ""))
              source_revision = str(request.get("source_revision", ""))

          if not re.fullmatch(r"[0-9]+", run_id):
              raise SystemExit("invalid source_run_id")
          if not re.fullmatch(r"[A-Za-z0-9._-]+", artifact_name):
              raise SystemExit("invalid source_artifact_name")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", source_revision):
              raise SystemExit("invalid source_revision")

          print(f"run_id={run_id}")
          print(f"artifact_name={artifact_name}")
          print(f"source_revision={source_revision.lower()}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate B2 environment
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_S3_ENDPOINT B2_BUCKET_NAME AWS_DEFAULT_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "Required environment variable missing: $name" >&2
              exit 1
            fi
          done

      - name: Install research-data dependencies
        run: python -m pip install -e ".[research-data]"

      - name: Download exact verified locked dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: artifacts/source-lock
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Build, verify, publish, and read-back GOLD bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/backtest/publish_locked_dataset_to_b2.py \
            --dataset-dir artifacts/source-lock \
            --bundle-dir artifacts/b2-gold-bundle \
            --git-revision "${{ steps.source.outputs.source_revision }}" \
            | tee artifacts/b2-publish-result.json

      - name: Upload non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-gold-publication-evidence-${{ github.run_id }}
          path: |
            artifacts/b2-publish-result.json
            artifacts/b2-gold-bundle/manifest.json
            artifacts/b2-gold-bundle/checksums.json
          if-no-files-found: warn
          retention-days: 30
