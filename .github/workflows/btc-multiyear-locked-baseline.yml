name: BTC Multi-Year Locked Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/btc-multiyear-locked-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-multiyear-locked-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconfirm fail-closed Gate BTC archive coverage
        run: >-
          python scripts/backtest/probe_gate_multiyear_coverage.py
          --markets BTC_USDT
          --start-month 202101
          --end-month 202608
          --max-workers 8
          --timeout-seconds 12
          --max-retries 3
          --output artifacts/btc_multiyear_coverage.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-multiyear-coverage-${{ github.sha }}
          path: artifacts/btc_multiyear_coverage.json
          if-no-files-found: error
          retention-days: 30

  build-month-matrix:
    needs: coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      months: ${{ steps.matrix.outputs.months }}
    steps:
      - id: matrix
        name: Build deterministic 68-month matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          values = []
          year, month = 2021, 1
          while (year, month) <= (2026, 8):
              values.append(f"{year:04d}{month:02d}")
              month += 1
              if month == 13:
                  year += 1
                  month = 1
          assert len(values) == 68
          print("months=" + json.dumps(values, separators=(",", ":")))
          PY

  archive-shard:
    needs: build-month-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month: ${{ fromJSON(needs.build-month-matrix.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Derive exact UTC month bounds
        id: bounds
        shell: bash
        env:
          MONTH: ${{ matrix.month }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone

          value = os.environ["MONTH"]
          year = int(value[:4])
          month = int(value[4:])
          if month == 12:
              end_year, end_month = year + 1, 1
          else:
              end_year, end_month = year, month + 1
          start = datetime(year, month, 1, tzinfo=timezone.utc)
          end = datetime(end_year, end_month, 1, tzinfo=timezone.utc)
          print("start=" + start.strftime("%Y-%m-%dT%H:%M:%SZ"))
          print("end=" + end.strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
      - name: Reconstruct BTC/USDT ${{ matrix.month }} from official Gate deals
        run: |
          python scripts/backtest/backfill_gate_deals_archive.py \
            --symbol BTC/USDT \
            --archive-month "${{ matrix.month }}" \
            --start "${{ steps.bounds.outputs.start }}" \
            --end "${{ steps.bounds.outputs.end }}" \
            --dataset-version 1.0.0 \
            --max-retries 3 \
            --retry-backoff-seconds 2 \
            --timeout-seconds 180 \
            --git-revision "$GITHUB_SHA" \
            --output-dir "artifacts/backfill/btc-usdt/archive-${{ matrix.month }}"
      - name: Upload verified month shard
        uses: actions/upload-artifact@v4
        with:
          name: btc-multiyear-btc-usdt-archive-${{ matrix.month }}-${{ github.sha }}
          path: artifacts/backfill/btc-usdt/archive-${{ matrix.month }}
          if-no-files-found: error
          retention-days: 30

  assemble-research-lock:
    needs: archive-shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download all 68 verified BTC monthly shards
        uses: actions/download-artifact@v4
        with:
          pattern: btc-multiyear-btc-usdt-archive-*-${{ github.sha }}
          path: artifacts/shards
          merge-multiple: false
      - name: Assemble and re-verify multi-year BTC research lock
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shard_dirs < <(find artifacts/shards -mindepth 1 -maxdepth 1 -type d -name "btc-multiyear-btc-usdt-archive-*-${GITHUB_SHA}" | sort)
          if [ "${#shard_dirs[@]}" -ne 68 ]; then
            echo "Expected exactly 68 monthly shard directories; got ${#shard_dirs[@]}" >&2
            exit 1
          fi
          shard_args=()
          for shard_dir in "${shard_dirs[@]}"; do
            shard_args+=(--shard-dir "$shard_dir")
          done
          python scripts/backtest/merge_locked_dataset_shards.py \
            "${shard_args[@]}" \
            --dataset-version 1.0.0 \
            --git-revision "$GITHUB_SHA" \
            --output-dir artifacts/research-lock/btc-usdt
      - name: Upload verified BTC multi-year research lock
        uses: actions/upload-artifact@v4
        with:
          name: btc-multiyear-btc-usdt-locked-${{ github.sha }}
          path: artifacts/research-lock/btc-usdt
          if-no-files-found: error
          retention-days: 30

  controlled-baseline:
    needs: assemble-research-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download verified BTC multi-year research lock
        uses: actions/download-artifact@v4
        with:
          name: btc-multiyear-btc-usdt-locked-${{ github.sha }}
          path: artifacts/research-lock/btc-usdt
      - name: Run frozen-strategy multi-year BTC evaluation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backtest/run_locked_historical_baseline.py \
            --dataset-dir artifacts/research-lock/btc-usdt \
            --evaluation-start 2021-07-20T00:00:00Z \
            --git-revision "$GITHUB_SHA" \
            --output artifacts/baseline/btc-usdt-multiyear-baseline.json
      - name: Upload multi-year baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-multiyear-baseline-${{ github.sha }}
          path: artifacts/baseline/btc-usdt-multiyear-baseline.json
          if-no-files-found: error
          retention-days: 30
