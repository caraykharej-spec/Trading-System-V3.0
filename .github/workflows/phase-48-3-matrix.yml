name: Phase 48.3 1000-Run Matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-48-3-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/backtest/test_phase_48_3_qualification_matrix.py
