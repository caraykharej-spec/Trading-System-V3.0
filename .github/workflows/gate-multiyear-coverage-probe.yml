name: Gate Multi-Year Coverage Probe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/backtest/probe_gate_multiyear_coverage.py"
      - "tests/backtest/test_gate_multiyear_coverage_probe.py"
      - ".github/workflows/gate-multiyear-coverage-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-multiyear-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate coverage probe helpers
        run: pytest -q tests/backtest/test_gate_multiyear_coverage_probe.py

  coverage-probe:
    needs: unit-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Gate deals coverage for BTC ETH SOL
        run: >-
          python scripts/backtest/probe_gate_multiyear_coverage.py
          --markets BTC_USDT ETH_USDT SOL_USDT
          --start-month 202101
          --end-month 202609
          --max-workers 8
          --timeout-seconds 12
          --output artifacts/gate_multiyear_coverage.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-multiyear-coverage-${{ github.sha }}
          path: artifacts/gate_multiyear_coverage.json
          if-no-files-found: error
          retention-days: 30
