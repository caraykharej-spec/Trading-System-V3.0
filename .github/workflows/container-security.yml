name: Container Security

on:
  pull_request:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "deploy/**", "pyproject.toml", "app/**", "interfaces/**"]
  push:
    branches: ["phase-44*"]

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Container / build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trading-system-v3:phase44
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trading-system-v3:phase44
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Assert non-root image user
        run: test "$(docker image inspect trading-system-v3:phase44 --format '{{.Config.User}}')" = "10001:10001"
