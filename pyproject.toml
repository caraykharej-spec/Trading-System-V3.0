[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system-v3"
version = "3.0.0.dev2"
description = "Modular rule-based paper and research trading system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "websocket-client>=1.8,<2",
]

[project.scripts]
trading-api = "interfaces.api.runtime:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*", "interfaces*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["app", "interfaces"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
exclude = ["tests/"]
