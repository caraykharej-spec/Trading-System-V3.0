services:
  trading-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: trading-system-v3:${TRADING_IMAGE_TAG:?set TRADING_IMAGE_TAG to an immutable release identifier}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes:
      - trading-data:/var/lib/trading-system
      - trading-backup:/var/backups/trading-system
    env_file:
      - path: production.env
        required: true
    environment:
      TRADING_API_ENV: production
      TRADING_API_HOST: 0.0.0.0
      TRADING_API_PORT: "8000"
      TRADING_DB_PATH: /var/lib/trading-system/trading.db
      TRADING_UNIVERSE_PATH: /etc/trading-system/universe.json
      TRADING_BACKUP_PATH: /var/backups/trading-system
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

volumes:
  trading-data:
  trading-backup:
